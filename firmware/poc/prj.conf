CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MAIN_STACK_SIZE=2048

CONFIG_NETWORKING=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
# Application configures addresses without a blocking net_config wait.
CONFIG_NET_CONFIG_SETTINGS=n
# TX is queued to the network stack; main never waits for driver transmission.
CONFIG_NET_TC_TX_COUNT=1
CONFIG_NET_MAX_CONTEXTS=2
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_RX_COUNT=16
CONFIG_NET_BUF_TX_COUNT=16
CONFIG_POC_DHCP=y
# Destination is intentionally empty until the operator selects the PC.
CONFIG_POC_DEST_IPV4=""
